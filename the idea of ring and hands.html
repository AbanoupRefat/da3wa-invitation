<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Question — An Interactive Proposal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap');

  :root{
    --ink:#171310;
    --ink-soft:#2b241d;
    --gold:#c9a24b;
    --gold-bright:#f3d98a;
    --gold-deep:#8a6a24;
    --blush:#f1d9cf;
    --cream:#f6ede1;
    --paper:#0f0b09;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--paper);
    font-family:'Jost',sans-serif;
    color:var(--cream);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #stage{
    position:relative;
    width:100%; height:100vh; height:100dvh;
    overflow:hidden;
  }

  /* ---------- Camera layer (soft drift + parallax) ---------- */
  #camera{
    position:absolute; inset:-6%;
    width:112%; height:112%;
    will-change:transform;
    transition: transform 1.2s cubic-bezier(.19,1,.22,1);
  }

  #bg{
    position:absolute; inset:0;
    background-image:url('__SCENE_BG__');
    background-size:cover;
    background-position:58% 45%;
    filter: saturate(0.9) brightness(0.55) blur(1.5px);
    transform: scale(1.08);
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 22% 88%, rgba(15,11,9,0.15) 0%, rgba(15,11,9,0.85) 62%, rgba(15,11,9,0.97) 100%),
      linear-gradient(180deg, rgba(15,11,9,0.55) 0%, rgba(15,11,9,0.15) 30%, rgba(15,11,9,0.65) 100%);
  }

  /* floating dust / bokeh particles for ambience */
  .mote{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle, rgba(243,217,138,0.9) 0%, rgba(243,217,138,0) 70%);
    pointer-events:none;
    animation: float-up linear infinite;
    opacity:0;
  }
  @keyframes float-up{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.55; }
    90%{ opacity:.35; }
    100%{ transform:translateY(-38vh) translateX(var(--drift,10px)); opacity:0; }
  }

  /* ---------- Hand target ---------- */
  #handWrap{
    position:absolute;
    right:-2%;
    bottom:6%;
    width:min(78vw, 460px);
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.55));
  }
  #handBare, #handRing{
    position:absolute; inset:0;
    width:100%; height:auto;
    display:block;
    user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  #handRing{ opacity:0; transition:opacity .5s ease; }
  #handRing.show{ opacity:1; }

  /* target marker glowing over the ring finger, hides inpaint softness + guides the user */
  #target{
    position:absolute;
    width:15%; aspect-ratio:1/1;
    left:57.5%; top:38%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
  }
  #target .ripple{
    position:absolute; inset:0; border-radius:50%;
    border:1.4px solid rgba(243,217,138,0.85);
    animation: ripple 2.4s ease-out infinite;
  }
  #target .ripple:nth-child(2){ animation-delay:.8s; }
  #target .core{
    position:absolute; inset:32%; border-radius:50%;
    background:radial-gradient(circle, rgba(243,217,138,0.55), rgba(243,217,138,0) 70%);
    animation: pulse-core 1.8s ease-in-out infinite;
  }
  @keyframes ripple{
    0%{ transform:scale(0.55); opacity:0; }
    30%{ opacity:.9; }
    100%{ transform:scale(1.3); opacity:0; }
  }
  @keyframes pulse-core{
    0%,100%{ opacity:.5; transform:scale(0.9); }
    50%{ opacity:.9; transform:scale(1.05); }
  }
  #target.armed .ripple{ border-color:rgba(255,255,255,0.95); animation-duration:1s; }
  #target.locked{ opacity:0; transition:opacity .4s ease; }

  /* ---------- Draggable 3D ring ---------- */
  #ringHome{
    position:absolute;
    left:8%;
    bottom:9%;
    width:34vw;
    max-width:190px;
    aspect-ratio:1/1;
  }
  #ringPerspective{
    position:absolute; inset:0;
    perspective: 700px;
  }
  #ring{
    position:absolute; inset:0;
    cursor:grab;
    touch-action:none;
    will-change:transform;
    transform-style:preserve-3d;
  }
  #ring.dragging{ cursor:grabbing; }
  #ring svg{ width:100%; height:100%; overflow:visible; display:block; }

  #ringShadow{
    position:absolute;
    left:8%; bottom:6%;
    width:34vw; max-width:190px; height:26px;
    transform:translateY(0);
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 72%);
    filter:blur(2px);
    pointer-events:none;
    transition:opacity .2s ease;
  }

  /* ---------- Sparkle canvas ---------- */
  #sparkleCanvas{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:40;
  }

  /* ---------- UI copy ---------- */
  #ui{
    position:absolute; left:0; right:0; top:0;
    padding: 6.5vh 7vw 0;
    text-align:left;
    z-index:30;
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Jost',sans-serif;
    font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--gold-bright); opacity:.85; margin:0 0 10px;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(28px, 6.2vw, 46px);
    line-height:1.08;
    margin:0 0 10px;
    color:var(--cream);
    max-width:11ch;
  }
  h1 em{ font-style:italic; color:var(--gold-bright); }
  #hint{
    font-size:13px; letter-spacing:.02em; color:rgba(246,237,225,0.68);
    max-width:30ch; line-height:1.5; margin:0;
    transition:opacity .5s ease;
  }

  #finaleCard{
    position:absolute; left:0; right:0; bottom:0;
    padding: 0 7vw 6vh;
    z-index:35;
    opacity:0; transform:translateY(14px);
    pointer-events:none;
    transition: opacity .9s ease .2s, transform .9s cubic-bezier(.19,1,.22,1) .2s;
  }
  #finaleCard.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #finaleCard .line{
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(20px,4.6vw,28px); color:var(--gold-bright);
    margin:0 0 4px;
  }
  #finaleCard .sub{
    font-size:12px; letter-spacing:.08em; color:rgba(246,237,225,0.6);
  }

  #soundToggle{
    position:absolute; top:6.5vh; right:7vw; z-index:40;
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(246,237,225,0.35);
    background:rgba(15,11,9,0.35);
    backdrop-filter: blur(6px);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #soundToggle svg{ width:16px; height:16px; }

  @media (prefers-reduced-motion: reduce){
    #camera{ transition:none; }
    .mote{ animation:none; display:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="camera">
    <div id="bg"></div>
    <div id="motes"></div>

    <div id="handWrap">
      <img id="handBare" src="__HAND_BARE__" alt="">
      <img id="handRing" src="__HAND_RING__" alt="">
      <div id="target"><div class="ripple"></div><div class="ripple"></div><div class="core"></div></div>
    </div>

    <div id="ringShadow"></div>
    <div id="ringHome">
      <div id="ringPerspective">
        <div id="ring" aria-label="Drag the ring onto her finger" role="button" tabindex="0">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fff3c9"/>
                <stop offset="22%" stop-color="#e7c569"/>
                <stop offset="45%" stop-color="#9c761f"/>
                <stop offset="55%" stop-color="#c9a24b"/>
                <stop offset="75%" stop-color="#fceec0"/>
                <stop offset="100%" stop-color="#8a6a24"/>
              </linearGradient>
              <radialGradient id="gemGrad" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="35%" stop-color="#eaf6ff"/>
                <stop offset="65%" stop-color="#bfe0ee"/>
                <stop offset="100%" stop-color="#8fb9cc"/>
              </radialGradient>
              <linearGradient id="facetShine" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <!-- band -->
            <path d="M 46 118 A 54 46 0 1 0 154 118 A 54 74 0 0 1 46 118 Z" fill="url(#bandGrad)" stroke="#5f4813" stroke-width="1.2"/>

            <!-- prongs -->
            <g fill="#d9b45f" stroke="#7a5c1c" stroke-width="0.8">
              <path d="M78 96 L74 74 L86 82 Z"/>
              <path d="M122 96 L126 74 L114 82 Z"/>
              <path d="M92 78 L88 58 L100 62 Z"/>
              <path d="M108 78 L112 58 L100 62 Z"/>
            </g>

            <!-- gem -->
            <g>
              <polygon points="100,50 122,68 116,96 84,96 78,68" fill="url(#gemGrad)" stroke="#7fa9bd" stroke-width="1"/>
              <polygon points="100,50 122,68 100,74" fill="#ffffff" opacity="0.55"/>
              <polygon points="100,50 78,68 100,74" fill="#dff0f8" opacity="0.5"/>
              <polygon points="84,96 100,74 78,68" fill="#a9cddd" opacity="0.6"/>
              <polygon points="116,96 100,74 122,68" fill="#9fc6d8" opacity="0.55"/>
              <polygon points="100,74 88,80 100,90 112,80" fill="#ffffff" opacity="0.35"/>
              <polygon points="90,55 100,50 96,60" fill="url(#facetShine)"/>
            </g>
            <g id="glintGroup" opacity="0">
              <path d="M100 40 L102 48 L110 50 L102 52 L100 60 L98 52 L90 50 L98 48 Z" fill="#ffffff"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <canvas id="sparkleCanvas"></canvas>

  <div id="ui">
    <p class="eyebrow">Abanoub &amp; Klara Studio — Da3wa Book</p>
    <h1>Will you <em>wear</em><br>this, forever?</h1>
    <p id="hint">Pick up the ring and guide it gently to her hand.</p>
  </div>

  <button id="soundToggle" aria-label="Toggle sound">
    <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path d="M16.5 8.5a5 5 0 0 1 0 7"/>
    </svg>
  </button>

  <div id="finaleCard">
    <p class="line">She said yes.</p>
    <p class="sub">TAP THE RING TO PLAY THE MOMENT AGAIN</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var camera = document.getElementById('camera');
  var ring = document.getElementById('ring');
  var ringHome = document.getElementById('ringHome');
  var ringShadow = document.getElementById('ringShadow');
  var target = document.getElementById('target');
  var handWrap = document.getElementById('handWrap');
  var handRing = document.getElementById('handRing');
  var handBare = document.getElementById('handBare');
  var hint = document.getElementById('hint');
  var finaleCard = document.getElementById('finaleCard');
  var soundToggle = document.getElementById('soundToggle');
  var glint = document.getElementById('glintGroup');
  var canvas = document.getElementById('sparkleCanvas');
  var ctx = canvas.getContext('2d');

  var soundOn = true;
  var locked = false;
  var homeRect, targetPoint, stageRect;

  /* ---------------- audio (Web Audio API, synthesized, no files) ---------------- */
  var actx = null;
  function getCtx(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
    }
    return actx;
  }
  function playClick(kind){
    if(!soundOn) return;
    try{
      var c = getCtx();
      if(c.state === 'suspended') c.resume();
      var now = c.currentTime;

      if(kind === 'pickup'){
        var o = c.createOscillator(), g = c.createGain();
        o.type='sine'; o.frequency.setValueAtTime(680, now);
        o.frequency.exponentialRampToValueAtTime(920, now+0.05);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.06, now+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now+0.09);
        o.connect(g); g.connect(c.destination);
        o.start(now); o.stop(now+0.1);
      } else if(kind === 'tick'){
        var o2=c.createOscillator(), g2=c.createGain();
        o2.type='triangle'; o2.frequency.setValueAtTime(1400, now);
        g2.gain.setValueAtTime(0.0001, now);
        g2.gain.exponentialRampToValueAtTime(0.035, now+0.005);
        g2.gain.exponentialRampToValueAtTime(0.0001, now+0.04);
        o2.connect(g2); g2.connect(c.destination);
        o2.start(now); o2.stop(now+0.05);
      } else if(kind === 'lock'){
        // soft percussive click + shimmer
        var noiseBuf = c.createBuffer(1, c.sampleRate*0.06, c.sampleRate);
        var data = noiseBuf.getChannelData(0);
        for(var i=0;i<data.length;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3); }
        var noise = c.createBufferSource(); noise.buffer = noiseBuf;
        var nf = c.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=2200; nf.Q.value=1.1;
        var ng = c.createGain(); ng.gain.setValueAtTime(0.16, now);
        ng.gain.exponentialRampToValueAtTime(0.0001, now+0.14);
        noise.connect(nf); nf.connect(ng); ng.connect(c.destination);
        noise.start(now);

        [1760, 2350, 3130].forEach(function(freq, idx){
          var so = c.createOscillator(), sg = c.createGain();
          so.type='sine'; so.frequency.value = freq;
          var t0 = now + 0.02 + idx*0.03;
          sg.gain.setValueAtTime(0.0001, t0);
          sg.gain.exponentialRampToValueAtTime(0.05, t0+0.02);
          sg.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
          so.connect(sg); sg.connect(c.destination);
          so.start(t0); so.stop(t0+0.55);
        });
      }
    }catch(e){ /* audio unsupported, fail silently */ }
  }

  soundToggle.addEventListener('click', function(){
    soundOn = !soundOn;
    soundToggle.style.opacity = soundOn ? '1' : '0.45';
  });

  function vibrate(pattern){
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }

  /* ---------------- ambient dust motes ---------------- */
  var motesWrap = document.getElementById('motes');
  for(var m=0; m<16; m++){
    var d = document.createElement('div');
    d.className = 'mote';
    var size = 2 + Math.random()*4;
    d.style.width = size+'px';
    d.style.height = size+'px';
    d.style.left = (Math.random()*100)+'%';
    d.style.top = (55 + Math.random()*40)+'%';
    d.style.setProperty('--drift', (Math.random()*40-20)+'px');
    d.style.animationDuration = (7+Math.random()*8)+'s';
    d.style.animationDelay = (Math.random()*8)+'s';
    motesWrap.appendChild(d);
  }

  /* ---------------- soft camera drift (idle) + parallax on pointer ---------------- */
  var camT = 0, pointerX = 0.5, pointerY = 0.5, camLocked = false;
  function camLoop(){
    camT += 0.0026;
    if(!camLocked){
      var driftX = Math.sin(camT) * 10;
      var driftY = Math.cos(camT*0.8) * 6;
      var parX = (pointerX - 0.5) * 14;
      var parY = (pointerY - 0.5) * 10;
      camera.style.transform = 'translate3d(' + (driftX+parX) + 'px,' + (driftY+parY) + 'px,0) scale(1.0)';
    }
    requestAnimationFrame(camLoop);
  }
  requestAnimationFrame(camLoop);

  stage.addEventListener('pointermove', function(e){
    var r = stage.getBoundingClientRect();
    pointerX = (e.clientX - r.left) / r.width;
    pointerY = (e.clientY - r.top) / r.height;
  });

  function cameraSettleOnLock(){
    camLocked = true;
    var r = stage.getBoundingClientRect();
    var hr = handWrap.getBoundingClientRect();
    var cx = (hr.left + hr.width*0.575) - r.left;
    var cy = (hr.top + hr.height*0.38) - r.top;
    var shiftX = (r.width/2 - cx) * 0.16;
    var shiftY = (r.height/2 - cy) * 0.16;
    camera.style.transition = 'transform 1.6s cubic-bezier(.19,1,.22,1)';
    camera.style.transform = 'translate3d(' + shiftX + 'px,' + shiftY + 'px,0) scale(1.045)';
    setTimeout(function(){
      camLocked = false;
      camera.style.transition = 'transform 1.2s cubic-bezier(.19,1,.22,1)';
    }, 2600);
  }

  /* ---------------- drag physics ---------------- */
  var dragging = false;
  var startX=0, startY=0, curX=0, curY=0, offX=0, offY=0;
  var vx=0, vy=0, lastX=0, lastY=0, lastT=0;
  var ringX=0, ringY=0; // translate offset from home position, in px
  var rotX=0, rotY=0, tiltTargetX=0, tiltTargetY=0;
  var idleT = Math.random()*10;
  var magnetActive = false;
  var raf = null;

  function resizeCanvas(){
    canvas.width = stage.clientWidth * devicePixelRatio;
    canvas.height = stage.clientHeight * devicePixelRatio;
    canvas.style.width = stage.clientWidth+'px';
    canvas.style.height = stage.clientHeight+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', function(){ resizeCanvas(); computeTarget(); });
  resizeCanvas();

  function computeTarget(){
    var tr = target.getBoundingClientRect();
    var sr = stage.getBoundingClientRect();
    targetPoint = {
      x: tr.left + tr.width/2 - sr.left,
      y: tr.top + tr.height/2 - sr.top,
      r: tr.width/2
    };
    stageRect = sr;
  }

  function ringCenter(){
    var rr = ring.getBoundingClientRect();
    var sr = stage.getBoundingClientRect();
    return { x: rr.left + rr.width/2 - sr.left, y: rr.top + rr.height/2 - sr.top };
  }

  function applyRingTransform(elevate){
    var lift = elevate ? -26 : 0;
    var scale = elevate ? 1.12 : 1;
    ring.style.transform =
      'translate3d(' + ringX + 'px,' + (ringY+lift) + 'px, 0) ' +
      'rotateX(' + (rotX) + 'deg) rotateY(' + (rotY) + 'deg) ' +
      'scale(' + scale + ')';

    var distScale = elevate ? 0.55 : 1;
    var blur = elevate ? 10 : 3;
    ringShadow.style.transform = 'translate3d(' + (ringX*0.6) + 'px,0,0) scaleX(' + distScale + ')';
    ringShadow.style.opacity = elevate ? 0.25 : 0.55;
    ringShadow.style.filter = 'blur(' + blur + 'px)';
  }

  function idleAnimate(t){
    if(!dragging && !locked){
      idleT += 0.012;
      rotY = Math.sin(idleT) * 10;
      rotX = Math.cos(idleT*0.7) * 4;
      applyRingTransform(false);
    }
    requestAnimationFrame(idleAnimate);
  }
  requestAnimationFrame(idleAnimate);

  function setArmed(on){
    if(on){ target.classList.add('armed'); } else { target.classList.remove('armed'); }
  }

  function onPointerDown(e){
    if(locked) return;
    dragging = true;
    ring.classList.add('dragging');
    ring.setPointerCapture && ring.setPointerCapture(e.pointerId);
    computeTarget();
    var p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    lastX = p.clientX; lastY = p.clientY; lastT = performance.now();
    vx = 0; vy = 0;
    playClick('pickup');
    vibrate(8);
    hint.style.opacity = '0.35';
    cancelMomentum();
    e.preventDefault();
  }

  function onPointerMove(e){
    if(!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    var now = performance.now();
    var dt = Math.max(now - lastT, 1);

    var dx = p.clientX - startX;
    var dy = p.clientY - startY;

    ringX = dx; ringY = dy;

    tiltTargetY = Math.max(-28, Math.min(28, dx * 0.12));
    tiltTargetX = Math.max(-22, Math.min(22, -dy * 0.12));
    rotY += (tiltTargetY - rotY) * 0.35;
    rotX += (tiltTargetX - rotX) * 0.35;

    vx = (p.clientX - lastX) / dt * 16;
    vy = (p.clientY - lastY) / dt * 16;
    lastX = p.clientX; lastY = p.clientY; lastT = now;

    // magnetic pull near target
    var c = ringCenter();
    var dtx = targetPoint.x - c.x;
    var dty = targetPoint.y - c.y;
    var dist = Math.sqrt(dtx*dtx + dty*dty);
    var pullRadius = targetPoint.r * 5.2;

    if(dist < pullRadius){
      if(!magnetActive){ magnetActive = true; setArmed(true); playClick('tick'); vibrate(12); }
      var strength = 1 - (dist/pullRadius);
      strength = Math.pow(strength, 1.6) * 0.55;
      ringX += dtx * strength * 0.5;
      ringY += dty * strength * 0.5;
    } else if(magnetActive){
      magnetActive = false; setArmed(false);
    }

    applyRingTransform(true);
    e.preventDefault();
  }

  function onPointerUp(e){
    if(!dragging) return;
    dragging = false;
    ring.classList.remove('dragging');
    hint.style.opacity = '0.68';

    var c = ringCenter();
    var dtx = targetPoint.x - c.x;
    var dty = targetPoint.y - c.y;
    var dist = Math.sqrt(dtx*dtx + dty*dty);
    var lockRadius = targetPoint.r * 2.0;

    if(dist < lockRadius * 3.4){
      lockRing();
    } else {
      startMomentum();
    }
  }

  function cancelMomentum(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }

  function startMomentum(){
    var friction = 0.93;
    function step(){
      ringX += vx; ringY += vy;
      vx *= friction; vy *= friction;

      var c = ringCenter();
      var dtx = targetPoint.x - c.x;
      var dty = targetPoint.y - c.y;
      var dist = Math.sqrt(dtx*dtx + dty*dty);
      var pullRadius = targetPoint.r * 5.2;

      if(dist < pullRadius){
        if(!magnetActive){ magnetActive = true; setArmed(true); playClick('tick'); vibrate(12); }
        var strength = 1 - (dist/pullRadius);
        strength = Math.pow(strength, 1.6);
        ringX += dtx * strength * 0.18;
        ringY += dty * strength * 0.18;
        if(dist < targetPoint.r * 2.0){
          lockRing();
          return;
        }
      }

      rotY += (0 - rotY) * 0.06;
      rotX += (0 - rotX) * 0.06;

      var speed = Math.sqrt(vx*vx+vy*vy);
      var elevate = speed > 0.4;
      applyRingTransform(elevate);

      // spring back home if drifted far with low speed and no magnet
      if(speed < 0.15 && !magnetActive){
        ringX += (0 - ringX) * 0.10;
        ringY += (0 - ringY) * 0.10;
        applyRingTransform(false);
        if(Math.abs(ringX) < 0.6 && Math.abs(ringY) < 0.6){
          ringX = 0; ringY = 0;
          applyRingTransform(false);
          return;
        }
      }
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  function lockRing(){
    if(locked) return;
    locked = true;
    cancelMomentum();
    setArmed(false);
    target.classList.add('locked');

    var c = ringCenter();
    var dtx = targetPoint.x - c.x;
    var dty = targetPoint.y - c.y;
    ringX += dtx; ringY += dty;
    rotX = 6; rotY = -8;
    ring.style.transition = 'transform .32s cubic-bezier(.2,1.4,.4,1)';
    applyRingTransform(false);
    ring.style.transform += ' scale(0.001)';

    playClick('lock');
    vibrate([10,30,10,60,18]);
    cameraSettleOnLock();

    setTimeout(function(){
      handRing.classList.add('show');
      burstSparkles();
      hint.style.opacity = '0';
      setTimeout(function(){
        finaleCard.classList.add('show');
      }, 500);
    }, 260);
  }

  function resetScene(){
    locked = false;
    handRing.classList.remove('show');
    target.classList.remove('locked');
    finaleCard.classList.remove('show');
    hint.style.opacity = '0.68';
    hint.textContent = 'Pick up the ring and guide it gently to her hand.';
    ring.style.transition = 'transform .5s cubic-bezier(.2,1,.3,1)';
    ringX = 0; ringY = 0; rotX = 0; rotY = 0;
    applyRingTransform(false);
    setTimeout(function(){ ring.style.transition = ''; }, 520);
  }

  finaleCard.addEventListener('click', function(){ resetScene(); });

  ring.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove, {passive:false});
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  ring.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ lockRing(); }
  });

  /* ---------------- sparkle burst (canvas particles) ---------------- */
  function burstSparkles(){
    var origin = ringCenter();
    var particles = [];
    var count = 46;
    for(var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var speed = 1.6 + Math.random()*4.2;
      particles.push({
        x: origin.x, y: origin.y,
        vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed - 1.2,
        life: 1, decay: 0.012 + Math.random()*0.014,
        size: 1.4 + Math.random()*2.6,
        star: Math.random() < 0.35
      });
    }
    var t0 = performance.now();
    function frame(){
      ctx.clearRect(0,0,canvas.clientWidth, canvas.clientHeight);
      var alive = false;
      for(var i=0;i<particles.length;i++){
        var p = particles[i];
        if(p.life <= 0) continue;
        alive = true;
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.045;
        p.vx *= 0.985;
        p.life -= p.decay;

        ctx.save();
        ctx.globalAlpha = Math.max(p.life,0);
        ctx.translate(p.x, p.y);
        var glow = ctx.createRadialGradient(0,0,0,0,0,p.size*4);
        glow.addColorStop(0, 'rgba(255,247,214,1)');
        glow.addColorStop(0.4, 'rgba(243,217,138,0.7)');
        glow.addColorStop(1, 'rgba(243,217,138,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0,0,p.size*4,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#fffdf3';
        if(p.star){
          drawStar(ctx, p.size*2.4);
        } else {
          ctx.beginPath();
          ctx.arc(0,0,p.size,0,Math.PI*2);
          ctx.fill();
        }
        ctx.restore();
      }
      if(alive && performance.now() - t0 < 2600){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0,0,canvas.clientWidth, canvas.clientHeight);
      }
    }
    requestAnimationFrame(frame);

    // radial flash glow behind hand
    var flash = document.createElement('div');
    flash.style.position='absolute';
    flash.style.left = (origin.x-140)+'px';
    flash.style.top = (origin.y-140)+'px';
    flash.style.width='280px'; flash.style.height='280px';
    flash.style.borderRadius='50%';
    flash.style.background='radial-gradient(circle, rgba(255,244,214,0.55) 0%, rgba(255,244,214,0) 70%)';
    flash.style.pointerEvents='none';
    flash.style.zIndex='25';
    flash.style.opacity='0';
    flash.style.transition='opacity .25s ease, transform 1.1s ease';
    flash.style.transform='scale(0.6)';
    stage.appendChild(flash);
    requestAnimationFrame(function(){
      flash.style.opacity='1';
      flash.style.transform='scale(1)';
      setTimeout(function(){
        flash.style.opacity='0';
        setTimeout(function(){ flash.remove(); }, 900);
      }, 260);
    });
  }

  function drawStar(ctx, r){
    ctx.beginPath();
    for(var i=0;i<4;i++){
      var a = (Math.PI/2)*i;
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = '#fffdf3';
    ctx.stroke();
  }

  computeTarget();
  window.addEventListener('load', computeTarget);
})();
</script>
